name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv --python 3.14
          uv pip install pytest-homeassistant-custom-component jsonschema ruff
      - name: Translations are generated, not edited by hand
        run: |
          .venv/bin/python tools/translations.py
          git diff --exit-code custom_components/rockcore_local/strings.json custom_components/rockcore_local/translations
      - name: No secrets or LAN addresses in the repository
        run: |
          ! git grep -nE '192\.168\.[0-9]+\.[0-9]+|100\.74\.[0-9]+\.[0-9]+|([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}'
      - name: Ruff
        run: .venv/bin/ruff check custom_components tests
      - name: Pytest
        run: .venv/bin/pytest -q
